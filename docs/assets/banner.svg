<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="harness-mini — a minimal outer harness for developers' long coding tasks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10161f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)" stroke="url(#acc)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- top-left stat · top-right the 40% line -->
  <text x="56" y="60" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#6e7681">15 skills · 5 sub-agents · POSIX shell · 0 deps</text>
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="1144" y="44" text-anchor="end" font-size="11" fill="#6e7681">the 40% line</text>
    <rect x="964" y="52" width="180" height="6" rx="3" fill="#30363d"/>
    <rect x="964" y="52" width="72" height="6" rx="3" fill="#58a6ff"/>
    <rect x="1034" y="48" width="2" height="14" fill="#e6edf3"/>
    <text x="1030" y="74" text-anchor="end" font-size="11" fill="#8b949e">smart</text>
    <text x="1042" y="74" font-size="11" fill="#8b949e">dumb</text>
  </g>

  <!-- wordmark -->
  <text x="600" y="126" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="64" font-weight="700" fill="#e6edf3">harness-mini</text>
  <rect x="370" y="142" width="460" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="600" y="186" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" fill="#8b949e">a minimal outer harness for developers' long coding tasks</text>

  <!-- lifecycle strip -->
  <text x="600" y="228" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#58a6ff">intake → prd → issues → implement ⇄ evaluate → checkpoint → done</text>
  <text x="600" y="252" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6e7681">garden runs orthogonally, on triggers — plans, checkpoints and evals live in git</text>

  <!-- wave -->
  <path d="M0 272 C 150 262, 300 280, 450 271 S 750 262, 900 274 S 1110 280, 1200 270 L 1200 280 L 0 280 Z" fill="url(#wave)"/>
</svg>
